<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Vitality Score</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #030712; color: #f3f4f6; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.7s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // --- Utility Functions ---
        // Supports standard videos AND YouTube Shorts
        const extractVideoId = (url) => {
            const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = url.match(regExp);
            return match ? match[1] : false;
        };

        // Simplified seeded random generator (saves space!)
        const seededRandom = (str) => {
            let seed = 0;
            for (let i = 0; i < str.length; i++) {
                seed = str.charCodeAt(i) + ((seed << 5) - seed);
            }
            return function() {
                const x = Math.sin(seed++) * 10000;
                return x - Math.floor(x);
            };
        };

        // --- Components ---
        const CircularScore = ({ score }) => {
            const radius = 60, stroke = 12;
            const normalizedRadius = radius - stroke * 2;
            const circumference = normalizedRadius * 2 * Math.PI;
            const strokeDashoffset = circumference - (score / 100) * circumference;
            const color = score > 70 ? "text-green-500" : score > 40 ? "text-yellow-500" : "text-red-500";

            return (
                <div className="relative flex items-center justify-center">
                    <svg height={radius * 2} width={radius * 2} className="transform -rotate-90">
                        <circle stroke="currentColor" fill="transparent" strokeWidth={stroke} r={normalizedRadius} cx={radius} cy={radius} className="text-gray-700" />
                        <circle stroke="currentColor" fill="transparent" strokeWidth={stroke} strokeDasharray={circumference + ' ' + circumference} style={{ strokeDashoffset, transition: 'stroke-dashoffset 1.5s ease-out' }} strokeLinecap="round" r={normalizedRadius} cx={radius} cy={radius} className={`${color} drop-shadow-md`} />
                    </svg>
                    <div className="absolute flex flex-col items-center justify-center">
                        <span className="text-4xl font-bold text-white">{score}</span>
                        <span className="text-xs text-gray-400 font-medium uppercase tracking-wider">Score</span>
                    </div>
                </div>
            );
        };

        const StatCard = ({ iconClass, label, value, subtext, colorClass }) => (
            <div className="bg-gray-800 border border-gray-700 rounded-2xl p-5 flex flex-col hover:border-gray-600 transition-colors">
                <div className="flex items-center space-x-3 mb-2">
                    <div className={`w-10 h-10 flex items-center justify-center rounded-lg ${colorClass} bg-opacity-10`}>
                        <i className={`${iconClass} ${colorClass} text-lg`}></i>
                    </div>
                    <span className="text-gray-400 text-sm font-medium">{label}</span>
                </div>
                <div className="text-2xl font-bold text-white mt-1">{value}</div>
                {subtext && <div className="text-xs text-gray-500 mt-2">{subtext}</div>}
            </div>
        );

        const ProgressBar = ({ label, percentage, colorClass }) => (
            <div className="mb-4 last:mb-0">
                <div className="flex justify-between text-sm mb-1">
                    <span className="text-gray-300 font-medium">{label}</span>
                    <span className="text-gray-400">{percentage}%</span>
                </div>
                <div className="w-full bg-gray-700 rounded-full h-2.5">
                    <div className={`h-2.5 rounded-full ${colorClass}`} style={{ width: `${percentage}%`, transition: 'width 1.5s ease-out' }}></div>
                </div>
            </div>
        );

        // --- Main Application ---
        function App() {
            const [url, setUrl] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [data, setData] = useState(null);

            const handleAnalyze = (e) => {
                e.preventDefault();
                if (!url.trim()) return;

                const videoId = extractVideoId(url);
                if (!videoId) {
                    setError("Please enter a valid YouTube Video or Shorts URL.");
                    setData(null);
                    return;
                }

                setError('');
                setLoading(true);
                setData(null);

                setTimeout(() => {
                    const rand = seededRandom(videoId);
                    const views = Math.floor(rand() * 5000000) + 10000;
                    const score = Math.floor(rand() * 60) + 40;
                    
                    setData({
                        videoId,
                        thumbnail: `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`,
                        fallbackThumbnail: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`,
                        vitalityScore: score,
                        views: views.toLocaleString(),
                        likes: Math.floor(views * (rand() * 0.05 + 0.01)).toLocaleString(),
                        comments: Math.floor(views * (rand() * 0.005 + 0.001)).toLocaleString(),
                        engagementRate: ((rand() * 8) + 2).toFixed(1),
                        viewsPerHour: Math.floor(rand() * 5000) + 100,
                        metrics: {
                            momentum: Math.floor(rand() * 100),
                            longevity: Math.floor(rand() * 100),
                            shareability: Math.floor(rand() * 100),
                        }
                    });
                    setLoading(false);
                }, 1500);
            };

            const handleThumbnailError = (e) => {
                if (data && e.target.src !== data.fallbackThumbnail) {
                    e.target.src = data.fallbackThumbnail;
                }
            };

            return (
                <div className="min-h-screen font-sans selection:bg-red-500 selection:text-white">
                    <nav className="border-b border-gray-800 bg-gray-900/50 backdrop-blur-md sticky top-0 z-50">
                        <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="bg-red-600 w-8 h-8 flex items-center justify-center rounded-lg shadow-lg shadow-red-600/20">
                                    <i className="fa-solid fa-chart-line text-white"></i>
                                </div>
                                <span className="text-xl font-bold tracking-tight text-white flex items-center">
                                    Vitality<span className="text-red-500">Score</span>
                                </span>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
                        <div className="text-center max-w-3xl mx-auto mb-12">
                            <h1 className="text-4xl md:text-5xl font-extrabold tracking-tight mb-4 text-white">
                                Measure the <span className="text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-400">Viral Potential</span>
                            </h1>
                            <p className="text-gray-400 text-lg mb-8">
                                Enter any standard YouTube video or Shorts URL to analyze its real-time vitality score.
                            </p>
                            
                            <form onSubmit={handleAnalyze} className="relative group">
                                <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i className="fa-brands fa-youtube text-gray-500 text-xl group-focus-within:text-red-500 transition-colors"></i>
                                </div>
                                <input
                                    type="text"
                                    value={url}
                                    onChange={(e) => setUrl(e.target.value)}
                                    placeholder="Paste URL (e.g. /watch?v=... or /shorts/...)"
                                    className="block w-full pl-12 pr-32 py-4 bg-gray-900 border border-gray-700 rounded-2xl leading-5 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500 sm:text-lg transition-all shadow-lg"
                                />
                                <div className="absolute inset-y-2 right-2">
                                    <button
                                        type="submit"
                                        disabled={loading}
                                        className="flex items-center justify-center w-full h-full px-6 bg-red-600 hover:bg-red-700 text-white rounded-xl font-medium transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        {loading ? (
                                            <i className="fa-solid fa-circle-notch fa-spin text-xl"></i>
                                        ) : (
                                            <>
                                                <span className="hidden sm:inline mr-2">Analyze</span>
                                                <i className="fa-solid fa-chevron-right hidden sm:inline"></i>
                                                <i className="fa-solid fa-magnifying-glass sm:hidden"></i>
                                            </>
                                        )}
                                    </button>
                                </div>
                            </form>
                            
                            {error && (
                                <div className="mt-4 flex items-center justify-center text-red-400 space-x-2">
                                    <i className="fa-solid fa-circle-exclamation"></i>
                                    <span>{error}</span>
                                </div>
                            )}
                        </div>

                        {loading && (
                            <div className="animate-pulse flex flex-col space-y-8 mt-16 max-w-4xl mx-auto">
                                <div className="h-64 bg-gray-800 rounded-3xl w-full"></div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="h-32 bg-gray-800 rounded-2xl"></div>
                                    <div className="h-32 bg-gray-800 rounded-2xl"></div>
                                    <div className="h-32 bg-gray-800 rounded-2xl"></div>
                                </div>
                            </div>
                        )}

                        {data && !loading && (
                            <div className="animate-in max-w-5xl mx-auto">
                                <div className="bg-gray-800/50 border border-gray-700 rounded-3xl p-6 md:p-8 flex flex-col md:flex-row gap-8 items-center mb-8 shadow-2xl backdrop-blur-sm">
                                    <div className="w-full md:w-1/2 relative rounded-2xl overflow-hidden shadow-lg group">
                                        <div className="absolute inset-0 bg-gradient-to-t from-gray-950 via-transparent to-transparent opacity-60 z-10"></div>
                                        <img 
                                            src={data.thumbnail} 
                                            onError={handleThumbnailError}
                                            alt="Video Thumbnail" 
                                            className="w-full h-auto aspect-video object-cover transform group-hover:scale-105 transition-transform duration-700"
                                        />
                                        <div className="absolute bottom-4 left-4 z-20 flex items-center space-x-2">
                                            <div className="bg-red-600 text-white text-xs font-bold px-2 py-1 rounded">ANALYZED</div>
                                            <div className="bg-gray-900/80 backdrop-blur-md text-white text-xs px-2 py-1 rounded">ID: {data.videoId}</div>
                                        </div>
                                    </div>
                                    
                                    <div className="w-full md:w-1/2 flex flex-col items-center md:items-start space-y-6">
                                        <div>
                                            <h2 className="text-2xl font-bold text-white mb-2 text-center md:text-left">Overall Vitality</h2>
                                            <p className="text-gray-400 text-center md:text-left text-sm max-w-xs">
                                                This score is calculated based on engagement velocity, views relative to time, and historical performance.
                                            </p>
                                        </div>
                                        
                                        <div className="flex items-center space-x-8 bg-gray-900/50 p-6 rounded-3xl border border-gray-700 w-full justify-center md:justify-start">
                                            <CircularScore score={data.vitalityScore} />
                                            <div className="flex flex-col space-y-4">
                                                <div className="flex items-center space-x-2">
                                                    <i className="fa-solid fa-arrow-trend-up text-green-500 w-5"></i>
                                                    <span className="text-gray-300 font-medium">Trending Up</span>
                                                </div>
                                                <div className="flex items-center space-x-2">
                                                    <i className="fa-solid fa-bolt text-yellow-500 w-5"></i>
                                                    <span className="text-gray-300 font-medium">High Energy</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 mb-8">
                                    <StatCard iconClass="fa-brands fa-youtube" label="Estimated Views" value={data.views} subtext="Total cumulative" colorClass="text-blue-400" />
                                    <StatCard iconClass="fa-solid fa-thumbs-up" label="Likes" value={data.likes} subtext="User approvals" colorClass="text-green-400" />
                                    <StatCard iconClass="fa-solid fa-comment" label="Comments" value={data.comments} subtext="Active discussions" colorClass="text-pink-400" />
                                    <StatCard iconClass="fa-regular fa-clock" label="Velocity" value={`${data.viewsPerHour}/hr`} subtext="Views per hour" colorClass="text-orange-400" />
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <div className="bg-gray-800 border border-gray-700 rounded-3xl p-6 md:p-8">
                                        <div className="flex items-center space-x-3 mb-6">
                                            <i className="fa-solid fa-chart-simple text-indigo-400 text-xl"></i>
                                            <h3 className="text-xl font-bold text-white">Algorithm Factors</h3>
                                        </div>
                                        <div className="space-y-6">
                                            <ProgressBar label="Momentum (Growth Speed)" percentage={data.metrics.momentum} colorClass="bg-blue-500" />
                                            <ProgressBar label="Longevity (Evergreen Potential)" percentage={data.metrics.longevity} colorClass="bg-purple-500" />
                                            <ProgressBar label="Shareability (Viral Loops)" percentage={data.metrics.shareability} colorClass="bg-orange-500" />
                                        </div>
                                    </div>

                                    <div className="bg-gray-800 border border-gray-700 rounded-3xl p-6 md:p-8 flex flex-col justify-center">
                                        <div className="flex items-center space-x-3 mb-6">
                                            <i className="fa-solid fa-share-nodes text-teal-400 text-xl"></i>
                                            <h3 className="text-xl font-bold text-white">Engagement Rate</h3>
                                        </div>
                                        <div className="flex items-baseline space-x-2 mb-4">
                                            <span className="text-6xl font-extrabold text-white">{data.engagementRate}%</span>
                                            <span className="text-gray-400 font-medium">/ 100</span>
                                        </div>
                                        <p className="text-gray-400 text-sm leading-relaxed mb-6">
                                            Videos with an engagement rate above 4.5% generally trigger the YouTube recommendation algorithm more frequently. 
                                            {data.engagementRate > 4.5 ? " This video is performing exceptionally well." : " This video is performing at a standard level."}
                                        </p>
                                        <div className="mt-auto pt-6 border-t border-gray-700">
                                            <div className="flex justify-between items-center text-sm">
                                                <span className="text-gray-500">Analysis Type</span>
                                                <span className="text-gray-300 font-medium bg-gray-900 px-3 py-1 rounded-full border border-gray-700">Predictive Simulation</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
